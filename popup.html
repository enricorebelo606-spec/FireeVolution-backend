<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>FireeVolution</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #17110d;
      color: #f3e9e2;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p.sub {
      font-size: 11px;
      color: #b98d6f;
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-size: 11.5px;
      margin-bottom: 4px;
      color: #ffcda3;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 140, 60, 0.3);
      background: #241811;
      color: #f3e9e2;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ef4b1f, #b3160a);
      color: #fff;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    #fe-status {
      margin-top: 10px;
      font-size: 11px;
      min-height: 14px;
    }
    .ok { color: #7be08c; }
    .err { color: #ff8a70; }
  </style>
</head>
<body>
  <h1>🔥 FireeVolution</h1>
  <p class="sub">Analista de vídeos com IA — YouTube, TikTok e Instagram.</p>

  <label for="fe-backend-url">URL do backend</label>
  <input type="text" id="fe-backend-url" placeholder="https://fireevolution-backend.onrender.com" />

  <button id="fe-save-btn">Salvar</button>
  <div id="fe-status"></div>
</body>
<script src="popup.js"></script>
</html>
